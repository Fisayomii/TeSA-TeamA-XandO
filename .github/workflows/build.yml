name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tictactoe
          POSTGRES_USER: tictactoe
          POSTGRES_PASSWORD: tictactoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        env:
          TTT_DB_URL: jdbc:postgresql://localhost:5432/tictactoe
          TTT_DB_USER: tictactoe
          TTT_DB_PASSWORD: tictactoe
        run: mvn --batch-mode clean verify
